<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Question Generator</title>
</head>

<body>

    <h1>AI Question Generator</h1>

    <label>Topic:</label>
    <input id="topic" value="Operating Systems">

    <br><br>

    <label>Difficulty:</label>

    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
    </select>

    <br><br>

    <label>Number of Questions:</label>
    <input id="count" type="number" value="5" min="1" max="50">

    <br><br>

    <button onclick="generateQuestions()">
        Generate Questions
    </button>

    <hr>

    <div id="status"></div>

    <div id="questions"></div>


    <script>

        async function generateQuestions() {

            const topic = document.getElementById("topic").value;

            const difficulty =
                document.getElementById("difficulty").value;

            const count =
                Number(document.getElementById("count").value);

            const status =
                document.getElementById("status");

            const questionsContainer =
                document.getElementById("questions");


            status.innerText = "Generating questions...";

            questionsContainer.innerHTML = "";


            try {

                const response = await fetch(
                    "https://project-crt.app.n8n.cloud/webhook/generate-questions",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            topic: topic,

                            difficulty: difficulty,

                            count: count,

                            question_type: "mcq"

                        })
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        `HTTP error: ${response.status}`
                    );

                }


                const data = await response.json();


                console.log("API Response:", data);


                status.innerText = "Questions generated!";


                data.questions.forEach((q) => {

                    const questionDiv =
                        document.createElement("div");


                    questionDiv.innerHTML = `

                        <h3>
                            ${q.id}. ${q.question}
                        </h3>

                        <p>
                            A. ${q.options[0]}
                        </p>

                        <p>
                            B. ${q.options[1]}
                        </p>

                        <p>
                            C. ${q.options[2]}
                        </p>

                        <p>
                            D. ${q.options[3]}
                        </p>

                        <p>
                            <strong>Answer:</strong>
                            ${q.answer}
                        </p>

                        <p>
                            <strong>Explanation:</strong>
                            ${q.explanation}
                        </p>

                        <hr>

                    `;


                    questionsContainer.appendChild(
                        questionDiv
                    );

                });

            }

            catch (error) {

                console.error(error);

                status.innerText =
                    "Failed to generate questions.";

                questionsContainer.innerHTML =
                    `<p>${error.message}</p>`;

            }

        }

    </script>

</body>

</html>
