<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice quiz · PrepAI</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2c;--muted:#9ba8bf;--text:#f3f6ff;--accent:#a5b0ff;--line:#29344d;--good:#75d7a2;--bad:#ff9292}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 72% 0%,#202d50 0,transparent 48%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header,main{width:min(900px,calc(100% - 36px));margin:auto}header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}a{color:var(--accent);text-decoration:none}.brand{color:var(--text);font-weight:750}.intro{padding:38px 0 20px}.intro h1{margin:0 0 6px;font-size:34px}.intro p,.hint{color:var(--muted)}form#settings,.question{border:1px solid var(--line);background:rgba(18,26,44,.92);border-radius:14px;padding:20px;margin:14px 0}.settings{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}label{display:grid;gap:7px;color:var(--muted);font-size:14px}input,select{width:100%;border:1px solid var(--line);background:#0d1424;color:var(--text);border-radius:8px;padding:11px;font:inherit}button{border:0;border-radius:9px;padding:11px 16px;background:#a5b0ff;color:#10162a;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.bar{display:flex;align-items:center;gap:14px;margin-top:16px}.bar .hint{margin:0}.question h2{font-size:19px;margin:0 0 14px}.options{display:grid;gap:9px}.option{display:flex;align-items:flex-start;gap:10px;background:#0d1424;border:1px solid var(--line);padding:11px;border-radius:9px;color:var(--text);cursor:pointer}.option:has(input:checked){border-color:var(--accent)}.option input{width:auto;margin:4px 0 0;accent-color:#a5b0ff}.question.correct{border-color:var(--good)}.question.incorrect{border-color:var(--bad)}.feedback{margin:12px 0 0;color:var(--muted)}#result{font-size:18px;font-weight:700;margin:18px 0}#result.error{color:var(--bad)}#result.success{color:var(--good)}[hidden]{display:none!important}@media(max-width:650px){.settings{grid-template-columns:1fr}.intro h1{font-size:29px}}body.embedded{background:var(--bg)}body.embedded>header{display:none}body.embedded main{width:100%;padding:0 16px}body.embedded .intro{padding-top:20px}
  </style>
  <style>.topic-group{display:grid;min-width:0;align-content:start;gap:12px}</style>
</head>
<body>
  <header><a class="brand" href="dashboard.html">← Dashboard</a><a href="home.html">Home</a></header>
  <p id="auth-status" role="status" aria-live="polite">Checking your sign-in…</p>
  <main id="quiz-page" hidden><section class="intro"><h1>Practice quiz</h1><p>Generate MCQs, choose one answer per question, and submit to see your score.</p></section>
    <form id="settings">
      <div class="settings">
        <div class="topic-group">
          <label for="topic">Topic<select id="topic" required>
            <option value="">Select a topic</option>
            <option>Operating Systems</option><option>Data Structures and Algorithms</option><option>Database Management Systems (DBMS)</option><option>Computer Networks</option><option>Object-Oriented Programming (OOP)</option><option>Computer Organization and Architecture</option><option>Software Engineering</option><option>Theory of Computation</option><option>Compiler Design</option><option>Python Programming</option><option>C Programming</option><option>C++ Programming</option><option>Java Programming</option><option>JavaScript</option><option>Web Development</option><option>React.js</option><option>Node.js</option><option>SQL</option><option>Machine Learning</option><option>Artificial Intelligence</option><option>Cloud Computing</option><option>Cybersecurity</option><option>Git and GitHub</option><option>Other</option>
          </select></label>
          <label id="custom-topic-label" for="custom-topic" hidden>Enter your topic<input id="custom-topic" placeholder="e.g., Distributed Systems"></label>
        </div>
        <label for="difficulty">Difficulty<select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
        <label for="count">Number of questions<input id="count" type="number" value="5" min="1" max="25" step="1" required></label>
      </div>
      <div class="bar"><button id="generate" type="submit">Generate questions</button><p id="status" class="hint" role="status" aria-live="polite"></p></div>
    </form>
    <p id="result" aria-live="polite"></p><form id="quiz" hidden><div id="questions"></div><button id="submit" type="submit">Submit quiz</button></form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="performance.js"></script>
  <script>
    let signedInUserId = null;
    if (new URLSearchParams(location.search).has("embedded")) document.body.classList.add("embedded");
    (async function requireSignedInUser() {
      const status = document.getElementById("auth-status");
      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (!data.session) {
          window.location.replace("auth.html#login");
          return;
        }
        signedInUserId = data.session.user.id;
        status.hidden = true;
        document.getElementById("quiz-page").hidden = false;
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (event !== "INITIAL_SESSION" && !session) window.location.replace("auth.html#login");
        });
      } catch (error) {
        console.error("Could not verify sign-in:", error);
        status.innerHTML = 'Could not verify your sign-in. <a href="auth.html#login">Log in again</a>.';
      }
    })();
  </script>
  <script>
    const endpoint = "https://project-crt.app.n8n.cloud/webhook/generate-questions";
    const settings = document.getElementById("settings");
    const quiz = document.getElementById("quiz");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const questionsContainer = document.getElementById("questions");
    const topicSelect = document.getElementById("topic");
    const customTopicInput = document.getElementById("custom-topic");
    const customTopicLabel = document.getElementById("custom-topic-label");
    let questions = [];
    let submitted = false;
    let generatedTopic = "";

    topicSelect.addEventListener("change", () => {
      const isOther = topicSelect.value === "Other";
      customTopicLabel.hidden = !isOther;
      customTopicInput.required = isOther;
      if (!isOther) customTopicInput.value = "";
      result.textContent = "";
      result.className = "";
    });

    function text(value) { return value == null ? "" : String(value); }
    function answerIndex(answer, options) {
      const raw = text(answer).trim();
      const letter = raw.match(/^(?:option\s*)?([a-d])(?:[.)\s]|$)/i);
      if (letter) return letter[1].toUpperCase().charCodeAt(0) - 65;
      const numeric = raw.match(/^(?:option\s*)?([1-4])(?:[.)\s]|$)/i);
      if (numeric) return Number(numeric[1]) - 1;
      return options.findIndex(option => text(option).trim().toLowerCase() === raw.toLowerCase());
    }
    function renderQuestions(items) {
      questionsContainer.replaceChildren();
      items.forEach((q, i) => {
        const card = document.createElement("section");
        card.className = "question";
        const heading = document.createElement("h2");
        heading.textContent = `${i + 1}. ${text(q.question)}`;
        card.append(heading);
        const options = document.createElement("div");
        options.className = "options";
        q.options.forEach((choice, j) => {
          const label = document.createElement("label");
          label.className = "option";
          const radio = document.createElement("input");
          radio.type = "radio"; radio.name = `question-${i}`; radio.value = String(j); radio.required = true;
          const caption = document.createElement("span");
          caption.textContent = `${String.fromCharCode(65 + j)}. ${text(choice)}`;
          label.append(radio, caption); options.append(label);
        });
        const feedback = document.createElement("p");
        feedback.className = "feedback"; feedback.hidden = true;
        card.append(options, feedback); questionsContainer.append(card);
      });
      quiz.hidden = false;
    }
    settings.addEventListener("submit", async event => {
      event.preventDefault();
      const selectedTopic = topicSelect.value;
      const topic = selectedTopic === "Other" ? customTopicInput.value.trim() : selectedTopic;
      const difficulty = document.getElementById("difficulty").value;
      const count = Number(document.getElementById("count").value);
      if (!topic) {
        result.textContent = selectedTopic === "Other" ? "Enter a technical topic to continue." : "Select a topic to continue.";
        result.className = "error";
        return;
      }
      if (!Number.isInteger(count) || count < 1 || count > 25) {
        result.textContent = "Please select between 1 and 25 questions.";
        result.className = "error";
        return;
      }
      generatedTopic = topic;
      document.getElementById("generate").disabled = true;
      status.textContent = "Generating questions…"; result.textContent = ""; result.className = "";
      quiz.hidden = true; questionsContainer.replaceChildren(); questions = []; submitted = false;
      try {
        const response = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ topic, difficulty, count, question_type: "mcq" }) });
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data.questions) || data.questions.length === 0) throw new Error("The webhook response did not contain any questions.");
        if (data.questions.some(q => !q || !q.question || !Array.isArray(q.options) || q.options.length < 2)) throw new Error("The webhook returned a question with missing options.");
        questions = data.questions; renderQuestions(questions); status.textContent = "Questions generated. Submit when you’re ready to see your score.";
      } catch (error) { console.error(error); status.textContent = "Failed to generate questions."; result.textContent = error.message; result.className = "error"; }
      finally { document.getElementById("generate").disabled = false; }
    });
    quiz.addEventListener("submit", event => {
      event.preventDefault(); if (submitted || !questions.length) return;
      const selected = questions.map((_, i) => quiz.querySelector(`input[name="question-${i}"]:checked`));
      if (selected.some(input => !input)) { result.textContent = "Choose an answer for every question before submitting."; result.className = "error"; return; }
      submitted = true; let score = 0;
      questions.forEach((q, i) => {
        const card = questionsContainer.children[i];
        const chosen = Number(selected[i].value); const correct = answerIndex(q.answer, q.options);
        const isCorrect = chosen === correct; if (isCorrect) score++;
        card.classList.add(isCorrect ? "correct" : "incorrect");
        card.querySelectorAll("input").forEach(input => { input.disabled = true; if (Number(input.value) === correct) input.parentElement.dataset.correct = "true"; });
        const feedback = card.querySelector(".feedback");
        feedback.hidden = false;
        const answerLabel = correct >= 0 && correct < q.options.length ? `${String.fromCharCode(65 + correct)}. ${text(q.options[correct])}` : text(q.answer);
        feedback.textContent = `${isCorrect ? "Correct" : `Correct answer: ${answerLabel}`}${q.explanation ? ` — ${text(q.explanation)}` : ""}`;
      });
      try {
        window.PrepAIPerformance.record(signedInUserId, {
          component: "MCQ Generation",
          topic: generatedTopic,
          difficulty: document.getElementById("difficulty").value,
          score,
          total: questions.length
        });
      } catch (error) {
        console.error("Could not save performance:", error);
        status.textContent = "Your score is shown, but this session could not be saved to your portfolio.";
      }
      result.textContent = `You got ${score} out of ${questions.length} correct.`; result.className = "success";
      document.getElementById("submit").disabled = true;
    });
  </script>
</body>
</html>
